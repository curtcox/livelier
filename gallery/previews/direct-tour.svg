<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640"><rect width="100%" height="100%" fill="#f4f6ed"/><g transform="matrix(1 0 0 1 28 25)" opacity="1"><rect width="640" height="58" rx="8" fill="transparent" stroke="#25473e" stroke-width="0"/><text x="8" y="38" font-family="Georgia, serif" font-size="34" text-anchor="start" fill="#294b3d">Everything is an invitation.</text></g><g transform="matrix(1 0 0 1 30 90)" opacity="1"><rect width="640" height="65" rx="8" fill="transparent" stroke="#25473e" stroke-width="0"/><text x="8" y="18" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" fill="#7b8d77">1. Alt-click the shape.  2. Move a handle.  3. Open the inspector.</text></g><g transform="matrix(0.9950041652780258 0.09983341664682815 -0.09983341664682815 0.9950041652780258 130 210)" opacity="1"><rect width="230" height="160" rx="8" fill="#b6a5cf" stroke="#25473e" stroke-width="0"/><text x="8" y="22" font-family="system-ui, sans-serif" font-size="18" text-anchor="start" fill="#233e36"></text></g><g transform="matrix(1 0 0 1 40 430)" opacity="1"><rect width="630" height="90" rx="8" fill="transparent" stroke="#25473e" stroke-width="0"/><text x="8" y="22" font-family="system-ui, sans-serif" font-size="18" text-anchor="start" fill="#233e36">4. Open ƒ to give the shape a click script.</text><text x="8" y="40" font-family="system-ui, sans-serif" font-size="18" text-anchor="start" fill="#233e36">5. Save a link to your new world.</text></g></svg>
